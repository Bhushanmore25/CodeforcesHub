<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      font-family: inherit;
      padding: 10px;
    }
    input, button {
      width: 100%;
      margin: 5px 0;
      padding: 8px;
      box-sizing: border-box;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h2>CodeforcesHub</h2>

  <div id="cf-section">
    <p>Repository Linked: <b id="linked-repo">None</b></p>
    
    <label for="gh-repo">GitHub Repository:</label>
    <input type="text" id="gh-repo" placeholder="username/repo">

    <label for="cf-handle">Codeforces Handle:</label>
    <input type="text" id="cf-handle" placeholder="E.g., Kavi965">
    
    <div id="auth-section" style="margin-top: 15px; border-top: 1px solid #ccc; padding-top: 10px;">
      <button id="btn-auth-github" style="background-color: #24292e; color: white;">Authenticate with GitHub</button>
      <p id="auth-status" style="font-size: 13px; color: #555;"></p>
    </div>
    
    <button id="save-cf-handle" style="margin-top: 10px;">Save Configurations & Start Tracking</button>
    <p id="cf-status"></p>
  </div>

  <script src="scripts/popup.js"></script>
</body>
</html>
